<!DOCTYPE html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Shikki's — Curated Style. Luxury Indian &amp; Fusion wear for men and women. Handcrafted designer bridal, festive and pret wear." />
    <title>Shikki's — Curated Style</title>

    <!-- Razorpay Checkout JS SDK -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <!-- Google Identity Services (GSI) SDK for 1-Tap Google Login -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!--
      BLOCKING THEME SCRIPT
      Sets data-theme="light" on <html> BEFORE first paint.
    -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('shikkis-theme');
          if (theme !== 'dark') {
            theme = 'light';
          }
          document.documentElement.setAttribute('data-theme', 'light');
        } catch (_) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
