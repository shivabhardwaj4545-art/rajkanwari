<!DOCTYPE html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Rajkanwari — House of Ethnic Wear. Curated Indian & Fusion wear for men and women. Shop authentic handcrafted clothing online." />
    <title>Rajkanwari — House of Ethnic Wear</title>

    <!-- Razorpay Checkout JS SDK -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <!-- Google Identity Services (GSI) SDK for 1-Tap Google Login -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!--
      BLOCKING THEME SCRIPT
      Sets data-theme on <html> BEFORE first paint to prevent theme flash.
    -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('shikkis-theme') || 'system';
          if (theme === 'system') {
            theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', theme);
        } catch (_) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
